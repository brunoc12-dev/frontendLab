version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    
  # Development service with hot reload
  dev:
    image: node:18-alpine
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - HOST=0.0.0.0
      - PORT=3000 